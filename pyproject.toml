[project]
name = "cvprofiles"
version = "2.0.1a1"
description = "Construct-validity profiles: admissible measurement sets and construct-identified ranges"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Augusto Gonzalez Bonorino" }]
keywords = ["econometrics", "measurement", "construct-validity", "partial-identification"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "pydantic>=2.0",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "pyyaml>=6.0",
  "typer>=0.12",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.8",
  "pandas-stubs>=2.0",
  "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/Bonorinoa/cvprofiles"
Repository = "https://github.com/Bonorinoa/cvprofiles"

[project.scripts]
cvprofiles = "cvprofiles.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# hatchling auto-discovers src/cvprofiles (src-layout) and includes all files
# under the package dir (including report/templates/*.j2) in the wheel. No
# force-include: it duplicated report.html.j2 and broke `uv build`.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "slow: full synthetic battery (seeds 0-4, n=1000)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The verify_h5_trust.py docstring carries the long canonical invocation as a
# single copy-paste line (E501 inside a docstring is string content, so noqa
# cannot suppress it).
"tools/verify_h5_trust.py" = ["E501"]
# build_tutorials.py embeds LaTeX display lines inside notebook markdown cell
# strings; splitting them would change the emitted notebook cells.
"tools/build_tutorials.py" = ["E501"]

[tool.mypy]
# Target the newest supported runtime: numpy>=2.5 stubs use PEP 695 `type`
# statements, which mypy only accepts when targeting 3.12+. Our source is
# 3.11-compatible and contains no 3.12-only syntax, so this is a strict
# superset of the old 3.11 check (and matches the py3.12 CI job).
python_version = "3.12"
strict = true
packages = ["cvprofiles"]
mypy_path = "src"
