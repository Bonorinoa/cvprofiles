[project]
name = "cvprofiles"
version = "1.1.0a1"
description = "Construct-validity profiles: admissible measurement sets and construct-identified ranges"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Augusto Gonzalez Bonorino" }]
keywords = ["econometrics", "measurement", "construct-validity", "partial-identification"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "pydantic>=2.0",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "pyyaml>=6.0",
  "typer>=0.12",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "mypy>=1.8",
  "pandas-stubs>=2.0",
  "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/Bonorinoa/cvprofiles"
Repository = "https://github.com/Bonorinoa/cvprofiles"

[project.scripts]
cvprofiles = "cvprofiles.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# hatchling auto-discovers src/cvprofiles (src-layout) and includes all files
# under the package dir (including report/templates/*.j2) in the wheel. No
# force-include: it duplicated report.html.j2 and broke `uv build`.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "slow: full synthetic battery (seeds 0-4, n=1000)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["cvprofiles"]
mypy_path = "src"
